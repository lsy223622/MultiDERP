services:
  uniderp:
    container_name: uniderp
    image: ghcr.io/lsy223622/uniderp:2.0.0-rc.1
    user: "10001:10001"
    restart: unless-stopped
    read_only: true

    # NET_BIND_SERVICE is sufficient for the non-root process to bind 80/443;
    # this deployment does not use CAP_NET_ADMIN or privileged mode.
    cap_add:
      - NET_BIND_SERVICE

    ports:
      - "443:443/tcp"
      - "80:80/tcp"
      - "127.0.0.1:3378:3378/tcp"
      - "0.0.0.0:3478:3478/udp"
      - "[::]:3478:3478/udp"

    volumes:
      - ./data:/data

    tmpfs:
      - /run/uniderp:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
