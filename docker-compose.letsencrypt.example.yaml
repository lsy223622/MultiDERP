services:
  multiderp:
    container_name: multiderp
    image: ghcr.io/example/multiderp:<pinned-release>
    user: "10001:10001"
    restart: unless-stopped
    read_only: true

    # NET_BIND_SERVICE is sufficient for the non-root process to bind 80/443;
    # this deployment does not use CAP_NET_ADMIN or privileged mode.
    cap_add:
      - NET_BIND_SERVICE

    ports:
      - "443:443/tcp"
      - "80:80/tcp"
      - "3478:3478/udp"

    volumes:
      - ./data:/data

    tmpfs:
      - /run/multiderp:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
