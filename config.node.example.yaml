version: 2

controller:
  enabled: false

node:
  controller_url: https://control.example.com
  state_dir: /data/node

server:
  hostname: relay.example.com
  derp:
    listen: ":3377"
    stun_listen: ":3478"
    tls_mode: external
    cert_mode: none
  admin:
    socket: /run/uniderp/admin.sock
  health:
    listen: "127.0.0.1:9090"

storage:
  state_dir: /data

logging:
  level: info
