services:
  multiderp:
    container_name: multiderp
    image: ghcr.io/lsy223622/multiderp:latest
    user: "10001:10001"
    restart: unless-stopped
    read_only: true

    # Nginx terminates public TLS on the host and forwards the DERP upgrade
    # stream to this loopback-only backend. Do not bind 3377 publicly.
    # STUN is UDP; publish it explicitly on both IPv4 and IPv6.
    ports:
      - "127.0.0.1:3377:3377/tcp"
      - "0.0.0.0:3478:3478/udp"
      - "[::]:3478:3478/udp"

    volumes:
      - ./data:/data

    # The image must not depend on a directory created in its read-only layer:
    # this mount is intentionally owner-controlled at runtime.
    tmpfs:
      - /run/multiderp:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
