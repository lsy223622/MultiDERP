<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniDERP · 集群管理</title>
<link rel="preload" href="/manage/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/manage/app.css">
<script src="/manage/app.js" defer></script>
</head>
<body>
<header><button id="nav-toggle" class="quiet" type="button" aria-label="展开导航" aria-controls="navigation" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a class="brand" href="/manage/">UniDERP</a></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="setup" class="login card" hidden>
<p class="eyebrow">UNIDERP CONTROL</p><h1>设置管理员</h1><p class="muted">首次使用，请设置管理员账号和密码。</p>
<form id="setup-form"><label>管理员用户名<input name="username" autocomplete="username" maxlength="80" required></label><label>密码（12–72 字节）<input name="password" type="password" autocomplete="new-password" required></label><label>确认密码<input name="password_confirm" type="password" autocomplete="new-password" required></label><button type="submit">创建管理员并登录</button></form>
</section>
<section id="login" class="login card" hidden>
<p class="eyebrow">UNIDERP</p><h1>登录管理面板</h1><p class="muted">主控管理员、节点提供者和成员使用主控账号登录；DERP 节点使用独立的本机管理员账号。</p>
<form id="login-form"><label>用户名<input name="username" autocomplete="username" maxlength="80" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button></form>
</section>
<div id="workspace" class="workspace" hidden>
<nav id="navigation" aria-label="管理导航">
<a class="sidebar-brand" href="/manage/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/></svg><span>UniDERP</span></a>
<div class="navigation-links">
<details data-nav-group open><summary><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.6-1.4-2.4 1.4-1.1a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1 0 2Z" transform="translate(-2 -2)"/></svg><span>主控</span></summary><div class="nav-items"><span class="nav-marker" hidden></span><a href="#bootstrap">初始设置</a><a href="#settings">集群设置</a><a href="#events">事件与审计</a></div></details>
<details data-nav-group open><summary><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/></svg><span>节点</span></summary><div class="nav-items"><span class="nav-marker" hidden></span><a href="#directory">节点列表</a><a href="#nodes">我的节点</a><a href="#member">本机节点</a><a href="#local">本机设置</a><a href="#requests">收到的使用申请</a></div></details>
<details data-nav-group open><summary><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a16 16 0 0 1 0 18 16 16 0 0 1 0-18Z"/></svg><span>Tailnet</span></summary><div class="nav-items"><span class="nav-marker" hidden></span><a href="#tailnets">我的 Tailnet</a><a href="#grants">节点使用授权</a><a href="#map">DERP map</a></div></details>
<details data-nav-group open><summary><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-4-5.7"/></svg><span>账号</span></summary><div class="nav-items"><span class="nav-marker" hidden></span><a href="#account">我的账号</a><a href="#users">账号管理</a></div></details>
</div>
<div id="account" hidden><button id="account-toggle" type="button" popovertarget="account-menu" aria-label="账号菜单"><span id="account-avatar" aria-hidden="true"></span><span><span id="account-name"></span><small id="account-role"></small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><div id="account-menu" class="more-options" popover="auto"><a href="#account">我的账号</a><button id="logout" type="button">退出</button></div></div>
</nav>
<main id="content" aria-live="polite"></main>
</div>
<footer>UniDERP · 状态以显示的观测来源与时间为准</footer>
