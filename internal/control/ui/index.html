<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniDERP · 集群管理</title>
<link rel="stylesheet" href="/manage/app.css">
<script src="/manage/app.js" defer></script>
</head>
<body>
<header><a class="brand" href="/manage/">UniDERP<span>共享中继管理</span></a><div id="account" hidden><span id="account-name"></span><button id="logout" class="quiet" type="button">退出</button></div></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="login" class="login card" hidden>
<p class="eyebrow">UNIDERP CONTROL</p><h1>登录集群</h1><p class="muted">使用管理员分配的账号管理你的尾网与中继。</p>
<form id="login-form"><label>用户名<input name="username" autocomplete="username" maxlength="80" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button></form>
</section>
<div id="workspace" class="workspace" hidden>
<nav aria-label="集群导航">
<a href="#tailnets">我的尾网</a><a href="#directory">服务器目录</a><a href="#nodes">我的服务器</a><a href="#grants">申请与授权</a><a href="#map">DERP map</a><a href="#events">事件与审计</a><a href="#account">我的账号</a><a href="#users" data-admin>账号管理</a><a href="#settings" data-admin>集群设置</a>
</nav>
<main id="content" aria-live="polite"></main>
</div>
<footer>UniDERP · 状态以显示的观测来源与时间为准</footer>
</body>
</html>
