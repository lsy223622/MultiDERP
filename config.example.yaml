version: 2

controller:
  enabled: true
  listen: "127.0.0.1:3341"
  database: /data/controller.sqlite
  key_file: /data/controller.key

node:
  state_dir: /data/node
  derp_port: 443
  stun_port: 3478
  max_budget_bps: 0

server:
  management:
    listen: ":3378"
  # Replace this with the public DNS name used by your DERP map.
  hostname: derp.example.com

  derp:
    # external keeps the child on an internal plaintext HTTP/upgrade port;
    # a compatible reverse proxy terminates public TLS.
    listen: ":3377"
    stun_listen: ":3478"
    tls_mode: external
    cert_mode: none

  admin:
    socket: /run/uniderp/admin.sock

  health:
    listen: "127.0.0.1:9090"

storage:
  state_dir: /data

logging:
  level: info
